<script>
const ASSETS = {"bgGym": "assets/backgrounds/gym.png", "bgLocker": "assets/backgrounds/locker.png", "bgLounge": "assets/backgrounds/lounge.png", "rina": "assets/characters/rina/sprite.png", "mio": "assets/characters/mio/sprite.png", "sakura": "assets/characters/sakura/sprite.png", "leader": "assets/characters/gym_leader/portrait.webp"};
const CHARS = {"rina": {"name": "Rina", "role": "Die ehrgeizige MMA-Athletin", "portrait": "rina", "outfits": ["Trainingsoutfit", "Gym-Look", "Freizeit-Look", "Date-Outfit", "Spezial-Outfit"], "leaderTips": ["Rina schätzt Verlässlichkeit und ehrliche Selbstkritik.", "Nimm ihren Einsatz ernst, aber gönne ihr auch Pausen.", "Frag sie, welche Unterstützung sie gerade möchte."], "scenes": [{"place": "Trainingsfläche", "opener": "„Stopp, dein Stand ist zu eng.“ Rina zeigt auf deine Füße. „Ich bin Rina. Wenn du möchtest, üben wir die Bewegung gemeinsam. Langsam ist für den Anfang völlig okay.“", "choices": [{"text": "„Danke. Zeigst du mir, worauf ich achten soll?“", "response": "„Gern. Erst der Stand, dann die Kraft.“ Sie stellt sich neben dich und geht die Bewegung mit dir durch.", "discover": "Sie schätzt Lernbereitschaft.", "aff": 8, "trust": 8}, {"text": "„Stimmt, ich wollte zu schnell zu viel.“", "response": "Rina nickt. „Den eigenen Fehler erkennen ist ein guter Anfang. Wir machen den nächsten Satz zusammen.“", "discover": "Sie mag ehrliche Selbstkritik.", "aff": 7, "trust": 9}, {"text": "„Nur wenn du meine unbeholfenen Versuche aushältst.“", "response": "Sie grinst. „Versuche halte ich aus. Ausreden weniger. Komm, wir probieren es.“", "discover": "Sie mag Humor und Einsatz.", "aff": 9, "trust": 7}]}, {"place": "MMA-Ring", "opener": "Nach dem Sparring bleibt Rina am Ring sitzen. „Heute habe ich jede Runde verloren. Mein erster Gedanke war: noch eine Stunde trainieren. Obwohl ich völlig fertig bin.“", "choices": [{"text": "„Wir können erst mal Pause machen. Ich bleibe bei dir.“", "response": "„Ohne gleich einen Plan zu machen?“ Sie atmet aus. „Ja. Das wäre gerade gut.“", "discover": "Sie schätzt Unterstützung ohne Leistungsdruck.", "aff": 8, "trust": 8}, {"text": "„Was brauchst du gerade: zuhören oder gemeinsam überlegen?“", "response": "Rina schaut dich an. „Zuhören. Ich will nicht, dass jeder schlechte Tag sofort repariert werden muss.“", "discover": "Sie möchte selbst sagen dürfen, was sie braucht.", "aff": 7, "trust": 9}, {"text": "„Eine Niederlage macht deinen Einsatz nicht kleiner.“", "response": "„Ich weiß das theoretisch.“ Ihr Lächeln wird weicher. „Vielleicht muss ich es manchmal von jemandem hören.“", "discover": "Sie mag Anerkennung für ihren Einsatz.", "aff": 9, "trust": 7}]}, {"place": "Smoothie-Bar", "opener": "Rina legt ihr Handy mit dem Trainingsplan weg. „Heute ist Ruhetag. Ungewohnt. Hättest du Lust, nach dem Shake mit mir spazieren zu gehen?“", "choices": [{"text": "„Gern. Du bestimmst das Tempo, ohne Stoppuhr.“", "response": "Sie lacht. „Abgemacht. Und diesmal zählen wir keine Schritte.“", "discover": "Sie mag gemeinsame Pausen.", "aff": 8, "trust": 8}, {"text": "„Ja. Ich würde dich gern auch außerhalb des Gyms kennenlernen.“", "response": "„Das würde ich auch gern.“ Sie hält deinen Blick. „Vielleicht erzähle ich dir dann von etwas anderem als Wettkämpfen.“", "discover": "Sie möchte als ganzer Mensch gesehen werden.", "aff": 7, "trust": 9}, {"text": "„Dann wird der Shake unser Ruhetagsritual?“", "response": "„Unser Ritual?“ Rina lächelt. „Das klingt nach einem guten Grund, Pausen einzuplanen.“", "discover": "Sie mag gemeinsame kleine Rituale.", "aff": 9, "trust": 7}]}], "age": 25, "bio": "Direkt und diszipliniert. Rina schätzt Verlässlichkeit und ehrliche Selbstkritik. Hinter ihrem Ehrgeiz fällt es ihr schwer, Pausen und Niederlagen zuzulassen."}, "mio": {"name": "Mio", "role": "Die humorvolle Trainingspartnerin", "portrait": "mio", "outfits": ["Trainingsoutfit", "Gym-Look", "Freizeit-Look", "Date-Outfit", "Spezial-Outfit"], "leaderTips": ["Mio liebt Humor und gemeinsame kleine Rituale.", "Hör auch dann zu, wenn sie gerade keinen Witz macht.", "Merk dir ihre Ziele. Sie möchte ernst genommen werden."], "scenes": [{"place": "Trainingsfläche", "opener": "Mio winkt dich zu zwei Matten. „Du kommst genau richtig! Kleine Balance-Challenge? Wer zuerst wackelt, darf den Shake-Geschmack aussuchen. Ich bin Mio, übrigens.“", "choices": [{"text": "„Deal. Meine Spezialität ist elegantes Umkippen.“", "response": "Mio lacht. „Endlich Konkurrenz auf meinem Niveau! Wir starten zusammen auf drei.“", "discover": "Sie mag schlagfertigen Humor.", "aff": 8, "trust": 8}, {"text": "„Gern. Zeigst du mir erst, wie die Übung geht?“", "response": "„Klar! Knie locker, Blick nach vorn. Wir wollen Spaß haben und nicht im Erste-Hilfe-Kurs enden.“", "discover": "Sie mag gemeinsame kleine Challenges.", "aff": 7, "trust": 9}, {"text": "„Und wenn wir beide gleichzeitig wackeln?“", "response": "„Dann erfinden wir einen Team-Shake. Wahrscheinlich eine kulinarische Katastrophe.“", "discover": "Sie liebt spontane gemeinsame Ideen.", "aff": 9, "trust": 7}]}, {"place": "Umkleide-Lounge", "opener": "In der Sitzecke wird Mio still. „Ich mache gern Witze. Aber vorhin hat jemand über mein Trainingsziel gelacht. Da habe ich mitgelacht, obwohl es mich getroffen hat.“", "choices": [{"text": "„Was ist dein Ziel? Ich würde es gern hören.“", "response": "„Mein erster Klimmzug ohne Hilfe.“ Sie richtet sich auf. „Danke, dass du wirklich fragst.“", "discover": "Sie möchte mit ihren Zielen ernst genommen werden.", "aff": 8, "trust": 8}, {"text": "„Du musst bei mir nichts mit einem Witz überspielen.“", "response": "„Gut.“ Mio lächelt vorsichtig. „Dann bin ich heute einfach mal enttäuscht. Schön, dass du trotzdem hierbleibst.“", "discover": "Sie schätzt ehrliches Interesse hinter dem Humor.", "aff": 7, "trust": 9}, {"text": "„Möchtest du reden oder lieber etwas Ablenkung?“", "response": "„Erst reden. Danach darfst du einen richtig schlechten Witz erzählen.“ Sie rückt ein Stück näher.", "discover": "Sie mag Rücksicht auf ihre Stimmung.", "aff": 9, "trust": 7}]}, {"place": "Smoothie-Bar", "opener": "Mio schiebt zwei Gläser über die Theke. „Unser Team-Shake! Ich habe die fragwürdigen Zutaten weggelassen. Wollen wir daraus einen festen Termin machen?“", "choices": [{"text": "„Sehr gern. Gleiche Zeit, gleicher fragwürdiger Humor.“", "response": "„Perfekt. Dann habe ich eine Woche, um neue schlechte Wortspiele zu sammeln.“", "discover": "Sie liebt gemeinsame Rituale.", "aff": 8, "trust": 8}, {"text": "„Ja. Und wie läuft dein Klimmzug-Ziel?“", "response": "Mio strahlt. „Du hast es dir gemerkt! Ein kleines Stück weiter. Nächstes Mal zeige ich es dir.“", "discover": "Sie freut sich, wenn du dich an ihre Ziele erinnerst.", "aff": 7, "trust": 9}, {"text": "„Ist das unsere nächste Challenge oder schon ein Date?“", "response": "„Ich hätte nichts gegen ein Date.“ Sie grinst und wird dann etwas leiser. „Wenn du auch Lust hast.“", "discover": "Sie mag spielerisches, ehrliches Flirten.", "aff": 9, "trust": 7}]}], "age": 24, "bio": "Offen, verspielt und immer für eine kleine Challenge zu haben. Mio liebt Schlagfertigkeit und gemeinsame Rituale. Hinter ihren Witzen möchte sie auch ernst genommen werden."}, "sakura": {"name": "Sakura", "role": "Die ruhige Kraftsportlerin", "portrait": "sakura", "outfits": ["Trainingsoutfit", "Gym-Look", "Freizeit-Look", "Date-Outfit", "Spezial-Outfit"], "leaderTips": ["Sakura schätzt ruhige Nähe und klare Absprachen.", "Frag, bevor du hilfst, und respektiere ihre Grenzen.", "Hinter ihrer Gelassenheit steckt Freude an fairen Wettbewerben."], "scenes": [{"place": "Trainingsfläche", "opener": "Sakura legt die Hantel zurück. „Hast du Erfahrung mit Spotten? Ich würde gern noch einen Satz machen. Falls nicht, zeige ich dir erst, wie du mich sicherst. Ich bin Sakura.“", "choices": [{"text": "„Zeig es mir bitte zuerst. Ich möchte dich sicher unterstützen.“", "response": "„Danke für die Ehrlichkeit.“ Sakura erklärt dir in Ruhe die Handgriffe und euer Stoppsignal.", "discover": "Sie schätzt Sicherheit und klare Absprachen.", "aff": 8, "trust": 8}, {"text": "„Gern. Sag mir, wann du Hilfe möchtest.“", "response": "„Genau so. Ich sage Bescheid.“ Nach dem Satz bedankt sie sich mit einem warmen Lächeln.", "discover": "Sie mag Unterstützung, die ihre Grenzen respektiert.", "aff": 7, "trust": 9}, {"text": "„Danach sicherst du meinen Satz?“", "response": "„Abgemacht.“ Sie lächelt. „Gegenseitige Unterstützung klingt nach einem guten Training.“", "discover": "Sie mag verlässliche Trainingspartnerschaften.", "aff": 9, "trust": 7}]}, {"place": "Trainingsfläche", "opener": "Sakura betrachtet eure Trainingsnotizen. „Du hast mich bei den sauberen Wiederholungen eingeholt. Kleine Revanche nächste Woche? Ich bin offenbar weniger gelassen, als ich aussehe.“", "choices": [{"text": "„Gern. Wir vergleichen unsere Technik, nicht unser Maximalgewicht.“", "response": "„Gute Regel.“ Ihr Grinsen überrascht dich. „Aber leicht mache ich es dir trotzdem nicht.“", "discover": "Sie mag faire, sichere Wettbewerbe.", "aff": 8, "trust": 8}, {"text": "„Ich mag diese ehrgeizige Seite an dir.“", "response": "„Die zeige ich nicht jedem.“ Sie sieht dich kurz an. „Mit dir fühlt es sich entspannt an.“", "discover": "Sie öffnet sich bei vertrauten Menschen.", "aff": 7, "trust": 9}, {"text": "„Heute bin ich müde. Können wir den Termin offenlassen?“", "response": "„Natürlich. Danke, dass du es sagst.“ Sie klappt das Heft zu. „Unsere Gesundheit geht vor.“", "discover": "Sie respektiert offen ausgesprochene Grenzen.", "aff": 9, "trust": 7}]}, {"place": "Smoothie-Bar", "opener": "Nach Feierabend sitzt Sakura mit dir an der ruhigen Theke. „Ich mag unsere gemeinsamen Abende. Heute habe ich allerdings wenig Gesprächsenergie. Ist still zusammensitzen auch okay?“", "choices": [{"text": "„Sehr. Ich bin gern einfach bei dir.“", "response": "Sakura entspannt die Schultern. Nach einer Weile legt sie ihre Hand neben deine. „Das tut gut.“", "discover": "Sie mag ruhige Nähe ohne Erwartungen.", "aff": 8, "trust": 8}, {"text": "„Natürlich. Sag Bescheid, wenn du lieber allein sein möchtest.“", "response": "„Gerade möchte ich, dass du bleibst.“ Sie lächelt. „Danke, dass ich trotzdem die Wahl habe.“", "discover": "Sie schätzt Nähe mit Raum für eigene Grenzen.", "aff": 7, "trust": 9}, {"text": "„Dann verabreden wir uns ein anderes Mal zum Reden?“", "response": "„Gern. Vielleicht ein Spaziergang zu zweit?“ Sie schaut dich fragend an. „Ich würde mich freuen.“", "discover": "Sie mag kleine, unaufgeregte Dates.", "aff": 9, "trust": 7}]}], "age": 27, "bio": "Aufmerksam, gelassen und überraschend wettbewerbsfreudig. Sakura mag ruhige Gespräche und gegenseitige Unterstützung. Nähe bedeutet für sie auch, eigene Grenzen aussprechen zu können."}};
const KEY='gymhearts-v05-dayparts';
const PARTS=['Vormittag','Nachmittag','Abend','Nacht'];
const INITIAL=()=>({rewarded:[],day:1,part:0,strength:12,fame:8,tab:'story',active:'rina',message:'',log:['Tag 1: Willkommen im Gym Hearts.'],leaderCount:0,characters:Object.fromEntries(Object.keys(CHARS).map(k=>[k,{aff:0,trust:0,chapter:1,scene:0,likes:[]} ])),current:null,modal:false});
let state; try{state=JSON.parse(localStorage.getItem(KEY))||INITIAL()}catch(e){state=INITIAL()} ;
for(const k of Object.keys(CHARS)){ state.characters[k] ??= {aff:0,trust:0,chapter:1,scene:0,likes:[]} }
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
state.part ??= 0;
const C=()=>CHARS[state.active], P=()=>state.characters[state.active];
const outfit=(k=state.active)=>{
 const rank=state.characters[k].chapter;
 const activity=state.current?.char===k?state.current.place:'';
 if(activity==='MMA-Ring') return rank>=2?'MMA-Set mit Bandagen':'Trainingsoutfit';
 if(activity==='Smoothie-Bar') return rank>=3?'Freizeit-Look':'Trainingsjacke nach dem Sport';
 if(activity==='Umkleide-Lounge') return 'Lockerer Hoodie';
 if(state.part===3) return rank>=3?'Gemütlicher Abendlook':'Trainingsjacke';
 if(state.part===2) return rank>=4?'Date-Outfit':'Freizeit-Look';
 return rank>=5?'Spezial-Outfit':rank>=2?'Gym-Look':'Trainingsoutfit';
};
const visualActivity = scene => scene?.place || (state.part===0?'Aufwärmen':state.part===1?'Training':state.part===2?'Ausklang':'Entspannen');
const visualMood = () => state.current ? (state.current.phase==='answered'?'Herzlich':'Aufmerksam') : (state.part===3?'Entspannt':state.part===2?'Ruhig':state.part===1?'Motiviert':'Wach');
const visualStyle = () => {
 const hue=[0,6,-6,16][state.part];
 const bright=[1.08,1.12,.96,.76][state.part];
 return `filter:hue-rotate(${hue}deg) brightness(${bright}) drop-shadow(0 16px 25px #000a);`;
};
// Mod-Kit: Bilddateien werden per relativer URL aus assets/ geladen.
// Gibt es eine optionale Variante nicht, wird automatisch sprite.png angezeigt.
const spriteFallback = key => ASSETS[key] || 'assets/characters/'+key+'/sprite.png';
function imageSlot(key){
 const scene=state.current && state.current.char===key ? state.current.place : '';
 let variant = 'training';
 if(scene==='MMA-Ring') variant='mma';
 else if(scene==='Smoothie-Bar') variant='casual';
 else if(scene==='Umkleide-Lounge') variant='rest';
 else if(state.part===3) variant='night';
 else if(state.part===2 && state.characters[key].chapter>=4) variant='date';
 else if(state.part===2) variant='casual';
 return `assets/characters/${key}/${variant}.png`;
}
function fallbackSprite(image,key){image.onerror=null;image.src=spriteFallback(key);}
// Debug-/Modding-Hinweis: zeigt im Spiel an, welches Bild gerade gesucht wird.
const currentAssetLabel=()=>imageSlot(state.active).split('/').pop();
const bgFor=place=>place==='Umkleide-Lounge'?ASSETS.bgLocker:place==='Smoothie-Bar'?ASSETS.bgLounge:ASSETS.bgGym;
function bar(v){return `<div class="bar"><i style="width:${Math.max(0,Math.min(100,v))}%"></i></div>`}
function log(t){state.log.unshift(`Tag ${state.day}: ${t}`); state.log=state.log.slice(0,80)}
function needEnergy(n){return true;}
function recalcChapter(k=state.active){const d=state.characters[k]; const newChap=Math.min(5,1+Math.floor(Math.min(d.aff,d.trust)/20)); if(newChap>d.chapter){d.chapter=newChap; log(`${CHARS[k].name} erreicht Kapitel ${newChap}. Neues Outfit freigeschaltet: ${outfit(k)}.`); state.message=`${CHARS[k].name} erreicht Kapitel ${newChap} – neues Outfit: ${outfit(k)}.`;}}
function gain(k,a,t){const d=state.characters[k]; d.aff=Math.min(100,d.aff+a); d.trust=Math.min(100,d.trust+t); recalcChapter(k);}
function selectChar(k){state.active=k; state.tab='story'; state.current=null; state.message=''; render();}
function startScene(){ if(!needEnergy(1)) return; const data=C(); const idx=Math.min(P().scene, data.scenes.length-1); const scene=data.scenes[idx]; state.current={char:state.active,index:idx,place:scene.place,phase:'open'};  state.message=''; log(`${data.name} startet ein Gespräch in der ${scene.place}.`); render(); }
function answerChoice(i){ const cur=state.current; if(!cur) return; const scene=CHARS[cur.char].scenes[cur.index]; const choice=scene.choices[i]; const mark=cur.char+':'+cur.index; state.rewarded ??= []; if(!state.rewarded.includes(mark)){gain(cur.char,choice.aff,choice.trust);state.rewarded.push(mark);} const d=state.characters[cur.char]; if(choice.discover && !d.likes.includes(choice.discover)) d.likes.push(choice.discover); state.current={...cur,phase:'answered',picked:i}; state.message=choice.response; log(`${CHARS[cur.char].name}: ${choice.response}`); render(); }
function finishScene(){ const cur=state.current; if(!cur) return; const d=state.characters[cur.char]; if(d.scene < CHARS[cur.char].scenes.length-1) d.scene++; state.current=null; state.message='Das Gespräch klingt angenehm aus. Beim nächsten Mal wartet ein neuer Story-Moment.'; render(); }
function askLeader(){ if(!needEnergy(1)) return;  state.leaderCount++; const tips=C().leaderTips; const idx=(state.leaderCount-1)%tips.length; const tip=tips[idx]; state.message=`Die Gym-Leiterin lehnt sich an den Tresen. „${tip}“`; log(`Die Gym-Leiterin gibt dir einen Tipp zu ${C().name}.`); render(); }
function train(kind){ if(!needEnergy(1)) return;  if(kind==='Krafttraining') state.strength+=3; else state.fame+=3; state.message=`${kind} abgeschlossen. Deine Werte steigen spürbar.`; log(state.message); render(); }
function endDay(){ state.rewarded=[]; state.day++; state.part=0; state.current=null; state.modal=false; state.message='Ein neuer Vormittag beginnt. Alle Figuren sind wieder da.'; log(state.message); render(); }
function nextPart(){if(state.part>=3){endDay();return}state.part++;state.current=null;state.message='Jetzt ist '+PARTS[state.part]+'. Du kannst weiterhin mit allen sprechen und trainieren.';log(state.message);render()}
function openEndModal(){ state.modal=true; render(); } function closeModal(){ state.modal=false; render(); } function switchTab(t){ state.tab=t; render(); }
function renderStory(){ const data=C(), prog=P(); const scene=(state.current&&state.current.char===state.active)?data.scenes[state.current.index]:null; let bubbleHtml=''; if(scene && state.current.phase==='open'){ bubbleHtml = `<div class="bubble npc"><span class="npcTag">${esc(data.name)} sagt</span>${esc(scene.opener)}</div><div class="scenePrompt">Wie möchtest du reagieren?</div><div class="choices">${scene.choices.map((c,i)=>`<button onclick="answerChoice(${i})">${esc(c.text)}<span class="choiceMeta">Deine Antwort beeinflusst eure Beziehung</span></button>`).join('')}</div>`; } else if(scene && state.current.phase==='answered'){ const picked=scene.choices[state.current.picked]; bubbleHtml = `<div class="bubble sys"><span class="playerTag">Deine Antwort</span>${esc(picked.text)}</div><div class="bubble npc"><span class="npcTag">${esc(data.name)} antwortet</span>${esc(state.message)}</div><div class="choices"><button onclick="finishScene()">Weiter</button></div>`; } else { bubbleHtml = `<div class="bubble sys"><span class="playerTag">Story-Start</span>${esc(state.message || (data.name+' · '+data.age+' Jahre. '+data.bio))}</div><div class="choices"><button onclick="startScene()">💬 Nächste Story-Szene starten</button></div>`; }
return `<div class="layout"><section class="panel hero"><div class="stage"><div class="bg" style="background-image:url('${bgFor(scene?scene.place:'Trainingsfläche')}')"></div><div class="shade"></div><div class="sceneHdr"><span class="badge">📍 ${esc(scene?scene.place:'Trainingsfläche')}</span><span class="badge">👕 ${esc(outfit())} · ${esc(currentAssetLabel())}</span></div><div class="nameBox"><h1>${esc(data.name)}</h1><p>${esc(data.role)}</p></div><div class="portraitWrap"><img src="${imageSlot(state.active)}" onerror="fallbackSprite(this,'${state.active}')" style="${visualStyle()}" alt="${esc(data.name)}"></div><div class="storyPictureInfo">${esc(visualMood())} · ${esc(visualActivity(scene))}</div></div><div class="dialogDeck">${bubbleHtml}</div></section><aside class="rightcol"><section class="panel"><h3>${esc(data.name)} · ${data.age} Jahre</h3><p class="small">${esc(data.role)}<br>${esc(data.bio)}</p><h3>Euer Fortschritt</h3><div class="statGrid"><div class="mini"><strong>Zuneigung</strong><span>${prog.aff}</span>${bar(prog.aff)}</div><div class="mini"><strong>Vertrauen</strong><span>${prog.trust}</span>${bar(prog.trust)}</div></div><div class="outfit" style="margin-top:12px"><strong>Kapitel ${prog.chapter}/5</strong><p class="small">Aktuelles Outfit: <strong>${esc(outfit())}</strong><br>Outfit-Status und Bildstimmung passen sich an Aktivität, Tageszeit und Beziehung an. Zusätzliche Outfitzeichnungen folgen.</p></div><div class="likes"><span>💪 MMA-Physique: fest</span>${prog.likes.map(x=>`<span>${esc(x)}</span>`).join('')}</div></section><section class="panel"><h3>Gym-Leader-Tipp</h3><div class="tipCard"><img src="${ASSETS.leader}" alt="Gym-Leiterin"><div class="small">Deine Kindheitsfreundin kennt die anderen Frauen gut und verrät dir, worauf sie positiv reagieren.</div></div><div class="choices" style="margin-top:12px"><button onclick="askLeader()">🗨️ Gym-Leiterin nach ${esc(data.name)} fragen</button><button onclick="switchTab('characters')">👥 Charakterübersicht öffnen</button></div></section></aside></div>`; }
function renderGym(){ return `<div class="layout"><section class="panel"><h2>Gym-Alltag</h2><div class="tipCard" style="grid-template-columns:1fr;gap:14px"><img src="${ASSETS.bgGym}" alt="Gym" style="width:100%;height:240px;object-fit:cover"><div class="small">Du bist neu im Muscle Gym. Trainiere als männlicher Hauptcharakter, sammle Stärke und Fame und lerne Rina, Mio und Sakura kennen. Alle drei Routen sind sofort offen und parallel spielbar. Gespräche und Vertrauen bringen euch näher; eine einzelne Antwort sperrt keine Route. Keine Energie und keine Käufe. Zusätzliche Figuren, Gym-Events und ein gemeinsames romantisches Ende sind für spätere Versionen geplant.</div></div><div class="choices" style="margin-top:12px"><button onclick="train('Krafttraining')">💪 Krafttraining</button><button onclick="train('MMA-Sparring')">🥊 MMA-Sparring</button><button onclick="askLeader()">🗨️ Gym-Leiterin fragen</button></div></section><aside class="rightcol"><section class="panel"><h3>Deine Werte</h3><div class="statGrid"><div class="mini"><strong>Tageszeit</strong><span style="font-size:18px">${PARTS[state.part]}</span></div><div class="mini"><strong>Stärke</strong><span>${state.strength}</span></div><div class="mini"><strong>Fame</strong><span>${state.fame}</span></div><div class="mini"><strong>Tage</strong><span>${state.day}</span></div></div></section><section class="panel"><h3>Hinweis</h3><p class="small">Der feste Button <strong>„Tag beenden“</strong> bleibt in jeder Ansicht unten rechts. Du musst nie erst zurück ins Hauptmenü.</p><div class="choices"><button onclick="switchTab('story')">Zur Story-Ansicht</button></div></section></aside></div>`; }
function renderCharacters(){ return `<section class="panel"><h2>Charaktere</h2><div class="switches">${Object.keys(CHARS).map(k=>`<button class="${state.active===k?'active':''}" onclick="selectChar('${k}')">${CHARS[k].name}</button>`).join('')}</div><div class="layout" style="margin-top:16px">${Object.keys(CHARS).map(k=>`<div class="panel"><div class="tipCard" style="grid-template-columns:110px 1fr"><img src="${imageSlot(k)}" onerror="fallbackSprite(this,'${k}')" alt="${esc(CHARS[k].name)}" style="width:110px;height:150px"><div><h3 style="margin:0">${esc(CHARS[k].name)}</h3><div class="small">${esc(CHARS[k].role)} · ${CHARS[k].age} Jahre</div><p class="small">${esc(CHARS[k].bio)}</p><div class="small">Kapitel ${state.characters[k].chapter} · Outfit: ${esc(outfit(k))}</div></div></div><div style="margin-top:10px">💕 ${state.characters[k].aff}${bar(state.characters[k].aff)}🤝 ${state.characters[k].trust}${bar(state.characters[k].trust)}</div><div class="likes">${state.characters[k].likes.length?state.characters[k].likes.map(l=>`<span>${esc(l)}</span>`).join(''):'<span class="ghost">Noch keine Vorlieben entdeckt</span>'}</div><div class="choices" style="margin-top:12px"><button onclick="selectChar('${k}')">Route öffnen</button></div></div>`).join('')}<div class="panel"><h3>🌟 Später im Gym</h3><div class="tipCard"><img src="${ASSETS.leader}" alt="Gym-Leiterin"><div class="small">Weitere erwachsene Figuren sollen über Gym-Events und neue Bekanntschaften dazukommen. Die Gym-Leiterin berät dich bereits bei den drei offenen Routen.</div></div><div class="likes"><span>Geplant</span><span>Noch nicht spielbar</span></div></div></div></section>`; }
function renderJournal(){ return `<section class="panel"><h2>Tagebuch</h2><div class="journal">${state.log.map(e=>`<div class="entry">${esc(e)}</div>`).join('')}</div><div class="choices" style="margin-top:12px"><button onclick="if(confirm('Spielstand wirklich löschen?')){state=INITIAL(); render();}">Spielstand zurücksetzen</button></div></section>`; }
function render(){ save(); document.getElementById('topStats').innerHTML=`📅 Tag ${state.day} · ${PARTS[state.part]} &nbsp; 💪 ${state.strength} &nbsp; ⭐ ${state.fame}`; document.getElementById('nav').innerHTML=[['story','💬 Story'],['gym','🏋️ Gym'],['characters','👥 Charaktere'],['journal','📖 Tagebuch']].map(([t,l])=>`<button class="${state.tab===t?'active':''}" onclick="switchTab('${t}')">${l}</button>`).join(''); document.getElementById('app').innerHTML = state.tab==='story' ? renderStory() : state.tab==='gym' ? renderGym() : state.tab==='characters' ? renderCharacters() : renderJournal(); document.getElementById('modalMount').innerHTML = state.modal ? `<div class="overlay"><div class="modal"><h2>🌙 Tag ${state.day} beenden?</h2><p class="small">Du beginnst morgen wieder am Vormittag. Beziehungen und Fortschritte bleiben erhalten.</p><div class="modalBtns"><button class="primary" onclick="endDay()">Ja, neuer Tag</button><button onclick="closeModal()">Noch bleiben</button></div></div></div>` : ''; }
render();
</script></body></html>
