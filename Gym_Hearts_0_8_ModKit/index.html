ter}.tipCard img{width:90px;height:120px;object-fit:cover;border-radius:14px}.small{font-size:13px;color:#d9cae4;line-height:1.6}.journal{display:grid;gap:10px;max-height:360px;overflow:auto}.entry{padding:12px;border-radius:14px;background:#231a32;border:1px solid #544061;font-size:13px;white-space:pre-line}.timebuttons{position:fixed;right:18px;bottom:18px;z-index:20;display:flex;gap:9px;flex-wrap:wrap;justify-content:end}.timebuttons button{padding:13px 16px;border-radius:14px;background:#30233c;border:1px solid #9e7fb2;color:white;font-weight:800;box-shadow:0 14px 35px #0009}.endday{position:static;padding:13px 16px;border-radius:14px;background:linear-gradient(135deg,#d985bf,#7d55d1);border:1px solid #ffc8ec;color:white;font-weight:900;box-shadow:0 14px 35px #0009}.overlay{position:fixed;inset:0;background:#0b0812cc;display:grid;place-items:center;z-index:30;padding:16px}.modal{width:min(540px,100%);background:#1c1528;border:1px solid #8660a1;border-radius:20px;padding:22px;box-shadow:0 20px 70px #000a}.modalBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.modalBtns button{padding:12px 14px;border-radius:14px;font-weight:800}.primary{background:linear-gradient(135deg,#ff90cc,#ce67c7);color:#2b1530}.likes{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.likes span{padding:7px 10px;border-radius:999px;background:#2e223c;border:1px solid #6e557a;color:#ffe7f3;font-size:12px}.outfit{padding:12px;border-radius:16px;background:#24192f;border:1px solid #664b74}.scenePrompt{font-size:15px;color:#f0e7f7}.ghost{opacity:.82}@media(max-width:980px){.layout{grid-template-columns:1fr}.hero{min-height:720px}.nameBox{max-width:100%}.portraitWrap{width:100%;justify-content:flex-end;opacity:.9}}@media(max-width:640px){main{padding:12px 12px 110px}.hero{min-height:760px}.portraitWrap{width:100%;opacity:.86}.bubble,.choices{max-width:100%}.nameBox h1{font-size:34px}.tipCard{grid-template-columns:70px 1fr}.tipCard img{width:70px;height:95px}}

<script>
const ASSETS = {"bgGym": "assets/backgrounds/gym.png", "bgLocker": "assets/backgrounds/locker.png", "bgLounge": "assets/backgrounds/lounge.png", "rina": "assets/characters/rina/sprite.png", "mio": "assets/characters/mio/sprite.png", "sakura": "assets/characters/sakura/sprite.png", "leader": "assets/characters/gym_leader/portrait.webp"};
const CHARS = {"rina": {"name": "Rina", "role": "Die Champion-Kämpferin", "portrait": "rina", "outfits": ["Trainingsoutfit", "Gym-Look", "Freizeit-Look", "Date-Outfit", "Spezial-Outfit"], "leaderTips": ["Sie mag klare Worte und Menschen, die wirklich zuhören.", "Wenn du ihre Disziplin ernst nimmst, fasst sie schneller Vertrauen.", "Ein ehrliches Lob für ihren Einsatz wirkt besser als leeres Angeben."], "scenes": [{"place": "Trainingsfläche", "opener": "Rina wischt sich den Schweiß von der Stirn und schaut zu dir rüber. „Hey. Du bist wieder da. Wenn du magst, kannst du mich heute beim letzten Satz anfeuern.“", "choices": [{"text": "Freundlich antworten: „Klar, ich bin dabei.“", "response": "Rina lächelt kurz. „Gut. Mit dir im Rücken ziehe ich immer noch ein bisschen härter durch.“", "aff": 8, "trust": 6, "discover": "Sie mag Unterstützung beim Training."}, {"text": "Zuhören und nachfragen: „Was trainierst du heute genau?“", "response": "„Explosivkraft. Wenn du nachfragst, statt nur zuzugucken, merkt man sofort, dass du’s ernst meinst.“", "aff": 6, "trust": 8, "discover": "Sie redet gern über Trainingsziele."}, {"text": "Locker scherzen: „Nur wenn ich danach einen Smoothie bekomme.“", "response": "Rina schnaubt amüsiert. „Deal. Aber nur, wenn du auch wirklich Stimmung machst.“", "aff": 7, "trust": 5, "discover": "Sie mag lockeren Humor, wenn er nicht respektlos ist."}]}, {"place": "MMA-Ring", "opener": "Nach dem Sparring setzt sich Rina neben dich auf den Ringrand. „Weißt du… die meisten sehen bei mir nur den Wettkampf. Nicht den Rest.“", "choices": [{"text": "Ehrlich sein: „Dann zeig mir den Rest.“", "response": "Rina wirkt überrascht, aber zufrieden. „Bei dir habe ich zum ersten Mal das Gefühl, nicht nur funktionieren zu müssen.“", "aff": 9, "trust": 9, "discover": "Sie öffnet sich, wenn man hinter die Fassade blickt."}, {"text": "Ruhig antworten: „Du musst nicht immer stark wirken.“", "response": "Sie nickt langsam. „Gut zu hören. Gerade von dir.“", "aff": 7, "trust": 10, "discover": "Sie mag ruhige, ehrliche Gespräche."}, {"text": "Kompliment machen: „Du wirkst trotzdem beeindruckend.“", "response": "„Heh… danke. Solange du das nicht nur wegen meiner Muskeln sagst.“", "aff": 8, "trust": 6, "discover": "Sie mag echte Komplimente mit Substanz."}]}, {"place": "Smoothie-Bar", "opener": "Rina schiebt dir einen Proteinshake rüber. „Ich hab dir denselben genommen wie mir. Mutiger Geschmackstest?“", "choices": [{"text": "Probieren und grinsen: „Wenn du’s ausgesucht hast, vertraue ich dir.“", "response": "„Das solltest du öfter sagen.“ Rina lehnt sich zurück und wirkt auffallend entspannt.", "aff": 10, "trust": 7, "discover": "Sie mag gemeinsame kleine Rituale."}, {"text": "Nachfragen: „Was ist da drin?“", "response": "„Banane, Beeren, ein bisschen Zimt. Ich mag’s simpel, aber gut.“", "aff": 6, "trust": 8, "discover": "Sie mag einfache Dinge, wenn sie mit Sorgfalt gemacht sind."}, {"text": "Teilen vorschlagen: „Dann trinken wir synchron.“", "response": "Rina lacht. „Okay, das ist albern. Aber irgendwie süß.“", "aff": 8, "trust": 6, "discover": "Sie mag spielerische Momente in ruhiger Atmosphäre."}]}]}, "mio": {"name": "Mio", "role": "Die ruhige Kraft", "portrait": "mio", "outfits": ["Trainingsoutfit", "Gym-Look", "Freizeit-Look", "Date-Outfit", "Spezial-Outfit"], "leaderTips": ["Mio mag ruhige Gespräche und Leute, die nicht drängen.", "Wenn du ihre Planung respektierst, öffnet sie sich schneller.", "Sie freut sich, wenn jemand ihre kleinen Fortschritte bemerkt."], "scenes": [{"place": "Trainingsfläche", "opener": "Mio hält ihr Trainingsheft an die Brust und spricht dich zuerst an. „Hey… wenn du gerade Zeit hast, kannst du mal schauen, ob meine Notizen Sinn ergeben?“", "choices": [{"text": "Freundlich helfen: „Gerne. Zeig mal her.“", "response": "Mio rückt ein Stück näher. „Danke. Bei dir fühlt es sich nie an, als würde ich stören.“", "aff": 8, "trust": 8, "discover": "Sie mag geduldige Hilfe."}, {"text": "Lobend antworten: „Du bist echt organisiert.“", "response": "Sie lächelt verlegen. „Ich versuche einfach, den Überblick zu behalten.“", "aff": 7, "trust": 7, "discover": "Sie mag es, wenn ihr Einsatz bemerkt wird."}, {"text": "Neugierig fragen: „Was schreibst du außer Gewichten noch auf?“", "response": "„Wie ich mich fühle. Sonst vergesse ich, dass Fortschritt mehr als Zahlen ist.“", "aff": 6, "trust": 9, "discover": "Sie spricht gern über Gedanken statt nur Statistiken."}]}, {"place": "Umkleide-Lounge", "opener": "Mio sitzt auf der Bank und trocknet ihre Haare. „Ist es okay, wenn wir einfach kurz hier sitzen? Ohne großen Trubel?“", "choices": [{"text": "Ruhig zustimmen: „Klar. Wir müssen nicht dauernd etwas tun.“", "response": "Mio entspannt sichtbar die Schultern. „Das ist schön. Mit dir fühlt Stille nie seltsam an.“", "aff": 9, "trust": 10, "discover": "Sie liebt angenehme, ruhige Nähe."}, {"text": "Sanft fragen: „Gibt es etwas, das dich beschäftigt?“", "response": "„Ein bisschen. Aber dass du fragst, hilft schon.“", "aff": 7, "trust": 10, "discover": "Sie mag vorsichtiges Nachfragen."}, {"text": "Kleinen Tee-Date-Vorschlag machen.", "response": "Mio nickt. „Ja… so etwas Kleines würde ich mögen.“", "aff": 8, "trust": 8, "discover": "Sie mag kleine, unaufgeregte Dates."}]}, {"place": "Smoothie-Bar", "opener": "An der Theke zeigt Mio auf ein Buch in deiner Tasche. „Du liest das auch? Dann müssen wir darüber reden.“", "choices": [{"text": "Interesse zeigen: „Erzähl mir deinen Lieblingsteil.“", "response": "Mios Augen leuchten auf. „Okay… aber dann musst du auch deinen nennen.“", "aff": 9, "trust": 8, "discover": "Sie mag Buch- und Mediengespräche."}, {"text": "Freundlich necken: „Nur wenn du nicht spoilerst.“", "response": "Sie lacht leise. „Ich gebe mein Bestes.“", "aff": 7, "trust": 7, "discover": "Sie mag vorsichtigen Humor."}, {"text": "Vorschlagen: „Dann machen wir mal ein Buchcafé-Date.“", "response": "„Das klingt… wirklich perfekt.“", "aff": 10, "trust": 8, "discover": "Ein Buchcafé ist ein ideales Date für sie."}]}]}, "sakura": {"name": "Sakura", "role": "Die fröhliche Herausforderin", "portrait": "sakura", "outfits": ["Trainingsoutfit", "Gym-Look", "Freizeit-Look", "Date-Outfit", "Spezial-Outfit"], "leaderTips": ["Sakura reagiert super auf gute Laune und spontane Ideen.", "Sie mag Menschen, die mitziehen statt zu zögern.", "Wenn du auf kleine Gesten eingehst, sammelt sie schnell Sympathie."], "scenes": [{"place": "Trainingsfläche", "opener": "Sakura winkt schon von weitem. „Da bist du ja! Ich hab gewettet, dass du heute wieder vorbeischaust. Willst du mir beweisen, dass ich recht hatte?“", "choices": [{"text": "Mitziehen: „Dann lass uns keine Wette verlieren.“", "response": "„Genau die Energie wollte ich hören!“ Sakura strahlt dich an.", "aff": 9, "trust": 6, "discover": "Sie mag spontane Motivation."}, {"text": "Freundlich lachen: „Ich bin wohl berechenbar geworden.“", "response": "„Nur auf die gute Art.“ Sie stupst dir leicht gegen den Arm.", "aff": 8, "trust": 6, "discover": "Sie mag leichte, verspielte Neckereien."}, {"text": "Nachfragen: „Und was gewinne ich dabei?“", "response": "„Ein Grinsen von mir ist schon ziemlich viel wert, oder?“", "aff": 7, "trust": 5, "discover": "Sie flirtet gern spielerisch."}]}, {"place": "MMA-Ring", "opener": "Nach ein paar Pads schlägt Sakura die Handschuhe gegeneinander. „Okay, ehrlich: Mit wem aus dem Gym würdest du am ehesten spontan etwas unternehmen?“", "choices": [{"text": "Direkt sein: „Mit dir.“", "response": "Sakura blinzelt, dann grinst sie breit. „Mutig. Ich mag das.“", "aff": 10, "trust": 7, "discover": "Sie mag direkte, klare Antworten."}, {"text": "Charmant antworten: „Mit der Person, die am meisten Spaß macht.“", "response": "„Und das bin zufällig ich, hm?“ Sie wirkt sichtbar zufrieden.", "aff": 8, "trust": 7, "discover": "Sie mag charmantes Flirten."}, {"text": "Locker sagen: „Kommt aufs Abenteuer an.“", "response": "„Dann finden wir eben eins, das zu uns passt.“", "aff": 8, "trust": 6, "discover": "Sie liebt spontane Unternehmungen."}]}, {"place": "Smoothie-Bar", "opener": "Sakura sitzt bereits auf dem Tresen und schaukelt mit dem Bein. „Ich hab eine Idee: Wir sollten mal was zusammen kochen. Chaotisch, aber lustig.“", "choices": [{"text": "Begeistert sein: „Ja, und du leitest das Chaos.“", "response": "„Deal! Aber wehe, du drückst dich vor dem Abschmecken.“", "aff": 9, "trust": 7, "discover": "Sie mag gemeinsames Kochen."}, {"text": "Neugierig fragen: „Was würdest du machen?“", "response": "„Etwas mit viel Farbe. Essen muss auch gute Laune machen.“", "aff": 7, "trust": 8, "discover": "Sie mag kreative, fröhliche Dinge."}, {"text": "Flirty antworten: „Solange wir am Ende zusammen essen.“", "response": "Sakura grinst. „Jetzt wird’s interessant.“", "aff": 10, "trust": 6, "discover": "Sie springt auf charmante Flirts an."}]}]}};
const KEY='gymhearts-v05-dayparts';
const PARTS=['Vormittag','Nachmittag','Abend','Nacht'];
const INITIAL=()=>({rewarded:[],day:1,part:0,strength:12,fame:8,tab:'story',active:'rina',message:'',log:['Tag 1: Willkommen im Gym Hearts.'],leaderCount:0,characters:Object.fromEntries(Object.keys(CHARS).map(k=>[k,{aff:0,trust:0,chapter:1,scene:0,likes:[]} ])),current:null,modal:false});
let state; try{state=JSON.parse(localStorage.getItem(KEY))||INITIAL()}catch(e){state=INITIAL()} ;
for(const k of Object.keys(CHARS)){ state.characters[k] ??= {aff:0,trust:0,chapter:1,scene:0,likes:[]} }
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
state.part ??= 0;
const C=()=>CHARS[state.active], P=()=>state.characters[state.active];
const outfit=(k=state.active)=>{
 const rank=state.characters[k].chapter;
 const activity=state.current?.char===k?state.current.place:'';
 if(activity==='MMA-Ring') return rank>=2?'MMA-Set mit Bandagen':'Trainingsoutfit';
 if(activity==='Smoothie-Bar') return rank>=3?'Freizeit-Look':'Trainingsjacke nach dem Sport';
 if(activity==='Umkleide-Lounge') return 'Lockerer Hoodie';
 if(state.part===3) return rank>=3?'Gemütlicher Abendlook':'Trainingsjacke';
 if(state.part===2) return rank>=4?'Date-Outfit':'Freizeit-Look';
 return rank>=5?'Spezial-Outfit':rank>=2?'Gym-Look':'Trainingsoutfit';
};
const visualActivity = scene => scene?.place || (state.part===0?'Aufwärmen':state.part===1?'Training':state.part===2?'Ausklang':'Entspannen');
const visualMood = () => state.current ? (state.current.phase==='answered'?'Herzlich':'Aufmerksam') : (state.part===3?'Entspannt':state.part===2?'Ruhig':state.part===1?'Motiviert':'Wach');
const visualStyle = () => {
 const hue=[0,6,-6,16][state.part];
 const bright=[1.08,1.12,.96,.76][state.part];
 return `filter:hue-rotate(${hue}deg) brightness(${bright}) drop-shadow(0 16px 25px #000a);`;
};
// Mod-Kit: Bilddateien werden per relativer URL aus assets/ geladen.
// Gibt es eine optionale Variante nicht, wird automatisch sprite.png angezeigt.
const spriteFallback = key => ASSETS[key] || 'assets/characters/'+key+'/sprite.png';
function imageSlot(key){
 const scene=state.current && state.current.char===key ? state.current.place : '';
 let variant = 'training';
 if(scene==='MMA-Ring') variant='mma';
 else if(scene==='Smoothie-Bar') variant='casual';
 else if(scene==='Umkleide-Lounge') variant='rest';
 else if(state.part===3) variant='night';
 else if(state.part===2 && state.characters[key].chapter>=4) variant='date';
 else if(state.part===2) variant='casual';
 return `assets/characters/${key}/${variant}.png`;
}
function fallbackSprite(image,key){image.onerror=null;image.src=spriteFallback(key);}
// Debug-/Modding-Hinweis: zeigt im Spiel an, welches Bild gerade gesucht wird.
const currentAssetLabel=()=>imageSlot(state.active).split('/').pop();
const bgFor=place=>place==='Umkleide-Lounge'?ASSETS.bgLocker:place==='Smoothie-Bar'?ASSETS.bgLounge:ASSETS.bgGym;
function bar(v){return `<div class="bar"><i style="width:${Math.max(0,Math.min(100,v))}%"></i></div>`}
function log(t){state.log.unshift(`Tag ${state.day}: ${t}`); state.log=state.log.slice(0,80)}
function needEnergy(n){return true;}
function recalcChapter(k=state.active){const d=state.characters[k]; const newChap=Math.min(5,1+Math.floor(Math.min(d.aff,d.trust)/20)); if(newChap>d.chapter){d.chapter=newChap; log(`${CHARS[k].name} erreicht Kapitel ${newChap}. Neues Outfit freigeschaltet: ${outfit(k)}.`); state.message=`${CHARS[k].name} erreicht Kapitel ${newChap} – neues Outfit: ${outfit(k)}.`;}}
function gain(k,a,t){const d=state.characters[k]; d.aff=Math.min(100,d.aff+a); d.trust=Math.min(100,d.trust+t); recalcChapter(k);}
function selectChar(k){state.active=k; state.tab='story'; state.current=null; state.message=''; render();}
function startScene(){ if(!needEnergy(1)) return; const data=C(); const idx=Math.min(P().scene, data.scenes.length-1); const scene=data.scenes[idx]; state.current={char:state.active,index:idx,place:scene.place,phase:'open'};  state.message=''; log(`${data.name} startet ein Gespräch in der ${scene.place}.`); render(); }
function answerChoice(i){ const cur=state.current; if(!cur) return; const scene=CHARS[cur.char].scenes[cur.index]; const choice=scene.choices[i]; const mark=cur.char+':'+cur.index; state.rewarded ??= []; if(!state.rewarded.includes(mark)){gain(cur.char,choice.aff,choice.trust);state.rewarded.push(mark);} const d=state.characters[cur.char]; if(choice.discover && !d.likes.includes(choice.discover)) d.likes.push(choice.discover); state.current={...cur,phase:'answered',picked:i}; state.message=choice.response; log(`${CHARS[cur.char].name}: ${choice.response}`); render(); }
function finishScene(){ const cur=state.current; if(!cur) return; const d=state.characters[cur.char]; if(d.scene < CHARS[cur.char].scenes.length-1) d.scene++; state.current=null; state.message='Das Gespräch klingt angenehm aus. Beim nächsten Mal wartet ein neuer Story-Moment.'; render(); }
function askLeader(){ if(!needEnergy(1)) return;  state.leaderCount++; const tips=C().leaderTips; const idx=(state.leaderCount-1)%tips.length; const tip=tips[idx]; state.message=`Die Gym-Leiterin lehnt sich an den Tresen. „${tip}“`; log(`Die Gym-Leiterin gibt dir einen Tipp zu ${C().name}.`); render(); }
function train(kind){ if(!needEnergy(1)) return;  if(kind==='Krafttraining') state.strength+=3; else state.fame+=3; state.message=`${kind} abgeschlossen. Deine Werte steigen spürbar.`; log(state.message); render(); }
function endDay(){ state.rewarded=[]; state.day++; state.part=0; state.current=null; state.modal=false; state.message='Ein neuer Vormittag beginnt. Alle Figuren sind wieder da.'; log(state.message); render(); }
function nextPart(){if(state.part>=3){endDay();return}state.part++;state.current=null;state.message='Jetzt ist '+PARTS[state.part]+'. Du kannst weiterhin mit allen sprechen und trainieren.';log(state.message);render()}
function openEndModal(){ state.modal=true; render(); } function closeModal(){ state.modal=false; render(); } function switchTab(t){ state.tab=t; render(); }
function renderStory(){ const data=C(), prog=P(); const scene=(state.current&&state.current.char===state.active)?data.scenes[state.current.index]:null; let bubbleHtml=''; if(scene && state.current.phase==='open'){ bubbleHtml = `<div class="bubble npc"><span class="npcTag">${esc(data.name)} sagt</span>${esc(scene.opener)}</div><div class="scenePrompt">Wie möchtest du reagieren?</div><div class="choices">${scene.choices.map((c,i)=>`<button onclick="answerChoice(${i})">${esc(c.text)}<span class="choiceMeta">Deine Antwort beeinflusst eure Beziehung</span></button>`).join('')}</div>`; } else if(scene && state.current.phase==='answered'){ const picked=scene.choices[state.current.picked]; bubbleHtml = `<div class="bubble sys"><span class="playerTag">Deine Antwort</span>${esc(picked.text)}</div><div class="bubble npc"><span class="npcTag">${esc(data.name)} antwortet</span>${esc(state.message)}</div><div class="choices"><button onclick="finishScene()">Weiter</button></div>`; } else { bubbleHtml = `<div class="bubble sys"><span class="playerTag">Story-Start</span>${esc(state.message || (data.name+' wartet nicht bloß auf einen Klick – sie beginnt ihre Gespräche selbst. Starte die nächste Szene, um das Storytelling mit Chat-Bubble auszuprobieren.'))}</div><div class="choices"><button onclick="startScene()">💬 Nächste Story-Szene starten</button></div>`; }
return `<div class="layout"><section class="panel hero"><div class="stage"><div class="bg" style="background-image:url('${bgFor(scene?scene.place:'Trainingsfläche')}')"></div><div class="shade"></div><div class="sceneHdr"><span class="badge">📍 ${esc(scene?scene.place:'Trainingsfläche')}</span><span class="badge">👕 ${esc(outfit())} · ${esc(currentAssetLabel())}</span></div><div class="nameBox"><h1>${esc(data.name)}</h1><p>${esc(data.role)}</p></div><div class="portraitWrap"><img src="${imageSlot(state.active)}" onerror="fallbackSprite(this,'${state.active}')" style="${visualStyle()}" alt="${esc(data.name)}"></div><div class="storyPictureInfo">${esc(visualMood())} · ${esc(visualActivity(scene))}</div></div><div class="dialogDeck">${bubbleHtml}</div></section><aside class="rightcol"><section class="panel"><h3>Fortschritt</h3><div class="statGrid"><div class="mini"><strong>Zuneigung</strong><span>${prog.aff}</span>${bar(prog.aff)}</div><div class="mini"><strong>Vertrauen</strong><span>${prog.trust}</span>${bar(prog.trust)}</div></div><div class="outfit" style="margin-top:12px"><strong>Kapitel ${prog.chapter}/5</strong><p class="small">Aktuelles Outfit: <strong>${esc(outfit())}</strong><br>Outfit-Status und Bildstimmung passen sich an Aktivität, Tageszeit und Beziehung an. Zusätzliche Outfitzeichnungen folgen.</p></div><div class="likes"><span>💪 MMA-Physique: fest</span>${prog.likes.map(x=>`<span>${esc(x)}</span>`).join('')}</div></section><section class="panel"><h3>Gym-Leader-Tipp</h3><div class="tipCard"><img src="${ASSETS.leader}" alt="Gym-Leiterin"><div class="small">Deine Kindheitsfreundin kennt die anderen Frauen gut und verrät dir, worauf sie positiv reagieren.</div></div><div class="choices" style="margin-top:12px"><button onclick="askLeader()">🗨️ Gym-Leiterin nach ${esc(data.name)} fragen</button><button onclick="switchTab('characters')">👥 Charakterübersicht öffnen</button></div></section></aside></div>`; }
function renderGym(){ return `<div class="layout"><section class="panel"><h2>Gym-Alltag</h2><div class="tipCard" style="grid-template-columns:1fr;gap:14px"><img src="${ASSETS.bgGym}" alt="Gym" style="width:100%;height:240px;object-fit:cover"><div class="small">Trainiere, sammle Stärke und Fame und hol dir später Story-Szenen mit den Charakteren. Keine Energie und keine Käufe: Jede Figur ist in jeder Tageszeit ansprechbar. Die Frauen sind bereits extrem muskulöse MMA-Athletinnen. Gespräche, Tageszeit und Storyaktivität beeinflussen die Bildstimmung und den Outfit-Status. Weitere individuell gezeichnete Outfitvarianten folgen.</div></div><div class="choices" style="margin-top:12px"><button onclick="train('Krafttraining')">💪 Krafttraining</button><button onclick="train('MMA-Sparring')">🥊 MMA-Sparring</button><button onclick="askLeader()">🗨️ Gym-Leiterin fragen</button></div></section><aside class="rightcol"><section class="panel"><h3>Deine Werte</h3><div class="statGrid"><div class="mini"><strong>Tageszeit</strong><span style="font-size:18px">${PARTS[state.part]}</span></div><div class="mini"><strong>Stärke</strong><span>${state.strength}</span></div><div class="mini"><strong>Fame</strong><span>${state.fame}</span></div><div class="mini"><strong>Tage</strong><span>${state.day}</span></div></div></section><section class="panel"><h3>Hinweis</h3><p class="small">Der feste Button <strong>„Tag beenden“</strong> bleibt in jeder Ansicht unten rechts. Du musst nie erst zurück ins Hauptmenü.</p><div class="choices"><button onclick="switchTab('story')">Zur Story-Ansicht</button></div></section></aside></div>`; }
function renderCharacters(){ return `<section class="panel"><h2>Charaktere</h2><div class="switches">${Object.keys(CHARS).map(k=>`<button class="${state.active===k?'active':''}" onclick="selectChar('${k}')">${CHARS[k].name}</button>`).join('')}</div><div class="layout" style="margin-top:16px">${Object.keys(CHARS).map(k=>`<div class="panel"><div class="tipCard" style="grid-template-columns:110px 1fr"><img src="${imageSlot(k)}" onerror="fallbackSprite(this,'${k}')" alt="${esc(CHARS[k].name)}" style="width:110px;height:150px"><div><h3 style="margin:0">${esc(CHARS[k].name)}</h3><div class="small">${esc(CHARS[k].role)}</div><div class="small">Kapitel ${state.characters[k].chapter} · Outfit: ${esc(outfit(k))}</div></div></div><div style="margin-top:10px">💕 ${state.characters[k].aff}${bar(state.characters[k].aff)}🤝 ${state.characters[k].trust}${bar(state.characters[k].trust)}</div><div class="likes">${state.characters[k].likes.length?state.characters[k].likes.map(l=>`<span>${esc(l)}</span>`).join(''):'<span class="ghost">Noch keine Vorlieben entdeckt</span>'}</div><div class="choices" style="margin-top:12px"><button onclick="selectChar('${k}')">Route öffnen</button></div></div>`).join('')}<div class="panel"><h3>🌟 Route #9</h3><div class="tipCard"><img src="${ASSETS.leader}" alt="Gym-Leiterin"><div class="small">Die Gym-Leiterin bleibt als versteckte finale Route vorbereitet. Sie berät dich schon jetzt bei den anderen drei.</div></div><div class="likes"><span>Geheim</span><span>Kindheitsfreundin</span><span>Später freischaltbar</span></div></div></div></section>`; }
function renderJournal(){ return `<section class="panel"><h2>Tagebuch</h2><div class="journal">${state.log.map(e=>`<div class="entry">${esc(e)}</div>`).join('')}</div><div class="choices" style="margin-top:12px"><button onclick="if(confirm('Spielstand wirklich löschen?')){state=INITIAL(); render();}">Spielstand zurücksetzen</button></div></section>`; }
function render(){ save(); document.getElementById('topStats').innerHTML=`📅 Tag ${state.day} · ${PARTS[state.part]} &nbsp; 💪 ${state.strength} &nbsp; ⭐ ${state.fame}`; document.getElementById('nav').innerHTML=[['story','💬 Story'],['gym','🏋️ Gym'],['characters','👥 Charaktere'],['journal','📖 Tagebuch']].map(([t,l])=>`<button class="${state.tab===t?'active':''}" onclick="switchTab('${t}')">${l}</button>`).join(''); document.getElementById('app').innerHTML = state.tab==='story' ? renderStory() : state.tab==='gym' ? renderGym() : state.tab==='characters' ? renderCharacters() : renderJournal(); document.getElementById('modalMount').innerHTML = state.modal ? `<div class="overlay"><div class="modal"><h2>🌙 Tag ${state.day} beenden?</h2><p class="small">Du beginnst morgen wieder am Vormittag. Beziehungen und Fortschritte bleiben erhalten.</p><div class="modalBtns"><button class="primary" onclick="endDay()">Ja, neuer Tag</button><button onclick="closeModal()">Noch bleiben</button></div></div></div>` : ''; }
render();
</script></body></html>
